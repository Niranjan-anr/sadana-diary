<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Rich Saffron Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    
    <!-- Central Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Center Petal Gradient -->
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
  </defs>

  <!-- Base App Icon Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Center Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)" />

  <!-- Japa Mala (Tracking Beads) Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="0 24" stroke-linecap="round" opacity="0.25" />
  <!-- Guru Bead & Tassel -->
  <circle cx="256" cy="406" r="10" fill="#FFFFFF" opacity="0.4" />
  <path d="M 256 414 L 248 438 L 264 438 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- Outer Lotus Petals -->
  <path d="M 256 340 C 120 330 70 240 60 190 C 110 220 180 260 256 280 Z" fill="#FFFFFF" opacity="0.35" />
  <path d="M 256 340 C 392 330 442 240 452 190 C 402 220 332 260 256 280 Z" fill="#FFFFFF" opacity="0.35" />

  <!-- Inner Lotus Petals -->
  <path d="M 256 350 C 160 320 120 210 110 140 C 160 190 200 250 256 290 Z" fill="#FFFFFF" opacity="0.75" />
  <path d="M 256 350 C 352 320 392 210 402 140 C 352 190 312 250 256 290 Z" fill="#FFFFFF" opacity="0.75" />

  <!-- Center Petal -->
  <path d="M 256 90 C 200 180 220 300 256 360 C 292 300 312 180 256 90 Z" fill="url(#lotusGrad)" />

  <!-- Golden Vaishnava Tilak & Tulasi Leaf -->
  <path d="M 256 140 C 240 200 242 260 256 320 C 270 260 272 200 256 140 Z" fill="#FFB300" opacity="0.9" />
  <path d="M 256 150 C 246 200 248 250 256 300 C 264 250 266 200 256 150 Z" fill="#FFF8E1" />
  <ellipse cx="256" cy="336" rx="5" ry="9" fill="#FFB300" />

  <!-- Open Diary / Book Base -->
  <!-- Left Page -->
  <path d="M 256 350 Q 180 320 100 360 L 100 390 Q 180 350 256 380 Z" fill="#FFFFFF" opacity="0.95" />
  <!-- Right Page -->
  <path d="M 256 350 Q 332 320 412 360 L 412 390 Q 332 350 256 380 Z" fill="#FFFFFF" opacity="0.95" />
  <!-- Center Crease / Spine shadow -->
  <path d="M 255 350 L 257 350 L 257 380 L 255 380 Z" fill="#D84315" opacity="0.2" />
</svg>
